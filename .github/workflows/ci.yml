name: CI

# Draait op elke pull request naar main en op elke push naar main.
# Meer dan bouwen en de rendertest doet deze workflow niet.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

      # De rendertest zet zelf een nep-PostgREST neer, dus er gaat niets over
      # het netwerk. De sleutels hieronder zijn nep. Ze zijn er alleen omdat de
      # client zonder sleutels niets aanmaakt.
      - run: npm run smoke
        env:
          VITE_SUPABASE_URL: https://smoke.invalid
          VITE_SUPABASE_ANON_KEY: smoke-not-a-real-key
