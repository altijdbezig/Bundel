name: CI

# Draait op elke pull request naar main en op elke push naar main.
# Twee dingen: web/ bouwen met de rendertest erachteraan, en de tests van
# server/. Meer niet.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

      # De rendertest zet zelf een nep-PostgREST neer, dus er gaat niets over
      # het netwerk. De sleutels hieronder zijn nep. Ze zijn er alleen omdat de
      # client zonder sleutels niets aanmaakt.
      - run: npm run smoke
        env:
          VITE_SUPABASE_URL: https://smoke.invalid
          VITE_SUPABASE_ANON_KEY: smoke-not-a-real-key

      # De tests van server/ draaien op node zelf, dus daar valt niets te
      # installeren. De stap start vanaf de hoofdmap, want de rest van deze
      # job staat standaard in web/.
      - name: server tests
        working-directory: .
        run: cd server && npm test
